name: Build & Release Business APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Business APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '[:space:]')
            TAG="v${RAW_VER}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using version tag: $TAG"

          # Auto-detect pre-release keywords (beta, alpha, dev, preview, rc) or manual input
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]] || [[ "$TAG" =~ -(beta|alpha|dev|preview|rc) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "Pre-release detected: true"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "Pre-release detected: false"
          fi
        shell: bash

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Environment (.env)
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ]; then
            echo "SUPABASE_URL=https://rsueaoglsdxhzpupjljd.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=sb_publishable_qP4whY5B6wxIasWOVGoPCw_vrhOXj_J" >> .env
          fi
        shell: bash

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Signing Keystore Exists
        run: |
          ls -la android/app/upload.jks
        shell: bash

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Ngam-Business-${TAG}.apk"
        shell: bash

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Ngam Business ${{ steps.version.outputs.TAG }}
          files: |
            Ngam-Business-*.apk
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
